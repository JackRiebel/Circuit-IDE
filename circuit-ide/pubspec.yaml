name: circuit_ide
description: "CircuitCode - AI-Powered Desktop IDE"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8
  flutter: 3.41.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Code Editor
  re_editor: ^0.8.0
  re_highlight: ^0.0.3

  # Terminal
  xterm: ^4.0.0

  # HTTP & Networking
  dio: ^5.4.0
  web_socket_channel: ^3.0.0

  # Data Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Markdown Rendering
  markdown_widget: ^2.3.0

  # File Handling
  file_picker: ^8.0.0
  path: ^1.9.0
  path_provider: ^2.1.0
  watcher: ^1.1.0

  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.0.0

  # UI Components
  flutter_svg: ^2.0.0
  google_fonts: ^6.0.0
  window_manager: ^0.4.0
  diff_match_patch: ^0.4.1
  fuzzy: ^0.5.1

  # Utilities
  crypto: ^3.0.7
  cryptography: ^2.9.0
  uuid: ^4.0.0
  collection: ^1.18.0
  intl: ^0.19.0
  url_launcher: ^6.2.0
  flutter_pty: ^0.4.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_generator: ^3.0.0
  riverpod_lint: ^3.0.0
  mocktail: ^1.0.0
  visibility_detector: ^0.4.0+2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/themes/
