name: CircuitCode CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  product-boundary:
    name: Canonical product boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Flutter is the only root product entry point
        run: |
          bash scripts/verify_canonical_product.sh
          bash scripts/verify_onboarding_docs.sh
          bash scripts/verify_user_docs.sh
          bash scripts/verify_security_ci.sh
          bash scripts/verify_artifact_visual_ci.sh

  flutter-macos:
    name: Flutter macOS product gate
    runs-on: macos-14
    defaults:
      run:
        working-directory: circuit-ide
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Install Office-compatible artifact renderers
        run: |
          brew install --cask libreoffice
          brew install poppler

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Flutter product
        run: flutter analyze

      - name: Publish deterministic task-engine evaluation
        run: bash scripts/task_engine_eval_suite.sh

      - name: Publish intent-routing evaluation
        run: bash scripts/intent_routing_eval_suite.sh

      - name: Enforce deterministic performance fixture budgets
        run: bash scripts/performance_budget_suite.sh

      - name: Run local-first sync architecture simulations
        run: bash scripts/verify_sync_architecture.sh

      - name: Run visual regression and artifact rendering gate
        run: bash scripts/visual_regression_suite.sh

      - name: Render full Office artifact matrix
        run: |
          export CIRCUIT_SOFFICE_PATH="/Applications/LibreOffice.app/Contents/MacOS/soffice"
          export CIRCUIT_PDFTOPPM_PATH="$(brew --prefix poppler)/bin/pdftoppm"
          bash scripts/verify_office_visual_render.sh

      - name: Publish artifact quality matrix
        run: bash scripts/artifact_quality_matrix_suite.sh

      - name: Run desktop Studio integration journey
        run: bash scripts/desktop_integration_suite.sh

      - name: Run Flutter test suite
        run: flutter test

      - name: Run native macOS app-host integration smoke
        run: >-
          xcodebuild test
          -workspace macos/Runner.xcworkspace
          -scheme Runner
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          -only-testing:RunnerTests

      - name: Build release macOS app
        run: flutter build macos --release

      - name: Launch packaged release macOS app
        run: |
          APP="build/macos/Build/Products/Release/CircuitCode.app"
          bash scripts/verify_packaged_app_launch.sh "$APP"

      - name: Capture packaged release performance evidence series
        run: |
          APP="build/macos/Build/Products/Release/CircuitCode.app"
          bash scripts/verify_release_performance_series.sh "$APP" 5

      - name: Exercise packaged command-execution boundary
        run: |
          APP="build/macos/Build/Products/Release/CircuitCode.app"
          bash scripts/verify_execution_broker.sh "$APP/Contents/Helpers/CircuitExecutionBroker"

      - name: Inspect release entitlements
        run: |
          APP="build/macos/Build/Products/Release/CircuitCode.app"
          bash scripts/verify_release_entitlements.sh "$APP"

      - name: Generate release SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./circuit-ide
          format: spdx-json
          artifact-name: CircuitCode-macos-sbom
          output-file: CircuitCode-macos.spdx.json
          upload-release-assets: false

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: CircuitCode-macos-unsigned
          path: circuit-ide/build/macos/Build/Products/Release/CircuitCode.app
          if-no-files-found: error

  security-red-team:
    name: Security red-team policy gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuit-ide
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Run required security red-team suite
        run: bash scripts/security_red_team_suite.sh

  secret-scan:
    name: Secret scanning gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  dependency-vulnerability-scan:
    name: Dependency vulnerability gate
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=./circuit-ide/pubspec.lock

  sbom:
    name: Source SBOM gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./circuit-ide
          format: spdx-json
          artifact-name: CircuitCode-source-sbom
          output-file: CircuitCode-source.spdx.json
          upload-release-assets: false

  all-checks:
    name: All CircuitCode checks passed
    needs: [product-boundary, flutter-macos, security-red-team, secret-scan, dependency-vulnerability-scan, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail unless every required product gate passed
        run: |
          if [[ "${{ needs.product-boundary.result }}" != "success" ]] || \
             [[ "${{ needs.flutter-macos.result }}" != "success" ]] || \
             [[ "${{ needs.security-red-team.result }}" != "success" ]] || \
             [[ "${{ needs.secret-scan.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-vulnerability-scan.result }}" != "success" ]] || \
             [[ "${{ needs.sbom.result }}" != "success" ]]; then
            echo "One or more required CircuitCode checks failed"
            exit 1
          fi
          echo "All required CircuitCode checks passed"
